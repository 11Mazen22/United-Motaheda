# Railway configuration for Ollama service
[build]
dockerfile = "Dockerfile.ollama"

[deploy]
numReplicas = 1
startCommand = ""  # Uses Dockerfile CMD

[variables]
OLLAMA_HOST = "0.0.0.0:11434"
OLLAMA_MODELS = "/root/.ollama/models"

[healthcheck]
timeout = 30
interval = 10
retries = 5
successThreshold = 1
failureThreshold = 3
