name: Sync npm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - apps/shopper-native/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --include=dev --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --include=dev --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore: sync npm lockfile"
            git push
          fi
