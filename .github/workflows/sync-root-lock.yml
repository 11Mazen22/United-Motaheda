name: Sync npm lockfiles

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - apps/shopper-native/package.json
      - apps/shopper-native/package-lock.json
      - packages/**
      - apps/shopper-web/package.json
      - apps/shopper-web/package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --include=dev --no-audit --no-fund
      - name: Generate shopper-native lockfile
        working-directory: apps/shopper-native
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Commit synchronized lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/shopper-native/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git commit -m "chore: sync npm lockfiles"
          git push
