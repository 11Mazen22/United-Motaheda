name: Sync root npm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - apps/shopper-native/package.json
      - packages/**
      - apps/shopper-web/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit root lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Root lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore: sync root npm lockfile"
          git push
